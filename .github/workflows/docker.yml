# Builds the Docker image for x86 (amd64) and ARM (arm64) and pushes it to Docker Hub.
# Needs the repository secret DOCKERHUB_TOKEN (a Docker Hub access token with read & write access).
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: m1v1n/pellet-pace

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Pull requests only check that the image builds; nothing is pushed.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: m1v1n
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main -> latest + sha-<short>; tag v1.2.3 -> 1.2.3, 1.2, 1
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
