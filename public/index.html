<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>Pellet Pace</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <!-- Apply a remembered Light/Dark choice before the first paint, so the page doesn't flash the other theme. -->
  <script>try { const t = localStorage.getItem('pp_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* ignore */ }</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="icon.svg" alt="" width="24" height="24"> Pellet Pace</a>
    <div id="topbar-actions" class="topbar-actions"></div>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
