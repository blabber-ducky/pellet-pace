services:
  pellet-pace:
    # Published by .github/workflows/docker.yml for amd64 and arm64. Set PELLET_PACE_TAG in .env to pin a version.
    image: m1v1n/pellet-pace:${PELLET_PACE_TAG:-latest}
    container_name: pellet-pace
    restart: unless-stopped
    # Only needs changing when DATA_DIR is a host folder: set to that folder's owner (see .env).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # Timezone for server-side dates (CSV file names, logs, automatic event ends).
      TZ: ${TZ:-Asia/Dubai}
      # Running events are ended automatically after this many hours (0 = never).
      AUTO_FINISH_HOURS: ${AUTO_FINISH_HOURS:-24}
      # Hostnames/IPs tablets and phones use to reach this machine, for the HTTPS certificate.
      TLS_HOSTS: ${TLS_HOSTS:-}
      # Only used the first time, when the admin account is created.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HTTPS: ${HTTPS:-1}
      # Your own certificate instead of the self-signed one: paths inside the container, under /certs.
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    volumes:
      # Deployment data (database + certificate). Defaults to the named volume below;
      # set DATA_DIR to a host path (e.g. /srv/pellet-pace) to use a folder instead.
      - ${DATA_DIR:-pellet-pace-data}:/app/data
      # Folder holding your own certificate and key, mounted read-only at /certs.
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    # Hardening: the app only writes to /app/data (and /tmp), needs no Linux capabilities and never
    # gains privileges, so lock all of that down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keep at most 3 x 10 MB of logs instead of letting them grow forever.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pellet-pace-data:
    name: pellet-pace-data
